<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petal</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
}

body {
    background: #000;
}

/* Background GIF */
.background {
    width: 100%;
    display: block;
}

/* Draggable flower */
#flower {
    position: absolute;
    top: 300px;
    left: 300px;
    width: 180px;
    cursor: grab;
    user-select: none;
    -webkit-user-drag: none;
    z-index: 10;
}

#flower:active {
    cursor: grabbing;
}
</style>
</head>
<body>

<img
    class="background"
    src="src/ig (1).gif"
    alt="Background artwork"
>

<img
    id="flower"
    src="src/gossypium-sturtianum-dig-13996-sm.jpg"
    alt="Enter map"
>

<script>
const flower = document.getElementById("flower");

let isDragging = false;
let moved = false;
let offsetX = 0;
let offsetY = 0;

flower.addEventListener("mousedown", (e) => {
    isDragging = true;
    moved = false;

    offsetX = e.clientX - flower.offsetLeft;
    offsetY = e.clientY - flower.offsetTop;
});

document.addEventListener("mousemove", (e) => {
    if (!isDragging) return;

    moved = true;

    flower.style.left = (e.clientX - offsetX) + "px";
    flower.style.top = (e.clientY - offsetY + window.scrollY) + "px";
});

document.addEventListener("mouseup", () => {
    isDragging = false;
});

flower.addEventListener("click", (e) => {
    if (moved) {
        e.preventDefault();
        return;
    }

    window.location.href = "./timeline-of-funded-genocide/";
});

/* Touch support */
flower.addEventListener("touchstart", (e) => {
    const touch = e.touches[0];

    isDragging = true;
    moved = false;

    offsetX = touch.clientX - flower.offsetLeft;
    offsetY = touch.clientY - flower.offsetTop;
});

document.addEventListener("touchmove", (e) => {
    if (!isDragging) return;

    const touch = e.touches[0];

    moved = true;

    flower.style.left = (touch.clientX - offsetX) + "px";
    flower.style.top = (touch.clientY - offsetY + window.scrollY) + "px";
});

document.addEventListener("touchend", () => {
    isDragging = false;
});
</script>

</body>
</html>
