<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taken, Year by Year</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A power map of the Commonwealth and Northern Territory institutions acting on Aboriginal children and families, the money behind them, and the Aboriginal-controlled organisations that work, 1824 to today.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a time bar on top; a left sidebar (details, saved, who held power); a zoomable power map:
   governments, then departments, then contractors, all standing on Country where Aboriginal-controlled organisations sit. */
:root{
  --bg:#111513; --surface:#1a201d; --surface2:#222a26; --ink:#e4e9e5; --muted:#98a39d; --line:#3a4440; --faint:#262e2a;
  --state:#344753; --state-ink:#eef2ef; --abo-head:#7c400e; --abo-ink:#ffe7ba; --country:#2a1a0d; --country-ink:#f6d7a2;
  --corp-head:#3d3d39; --corp-ink:#ebe8df; --corp-band:#1c211e;
  --harm:#ff7b67; --led:#e39c3e; --ok:#8fd18f; --warn:#f0c05c; --flow:#6db3f2; --shadow:0 14px 36px rgba(0,0,0,.55);
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
/* Funding mode: a blue ledger. Deaths mode: a red record. */
body.money{--bg:#07131f; --surface:#0d1f30; --surface2:#12283d; --ink:#cfe6ff; --muted:#88a8c6; --line:#25445f; --faint:#16304a;
  --state:#16466f; --state-ink:#e3f2ff; --country:#0e2a44; --country-ink:#d4e9ff; --corp-band:#0f2234; --flow:#62b0f5}
body.divest{--bg:#120607; --surface:#1d0b0c; --surface2:#2a1012; --ink:#ffd9d4; --muted:#c9928b; --line:#4a1d1e; --faint:#311416;
  --state:#4a1416; --state-ink:#ffe1dc; --country:#2a0d0e; --country-ink:#ffd6cf; --corp-band:#1c0a0b; --harm:#ff5a4a}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;display:flex;flex-direction:column;transition:background .3s,color .3s}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--harm);outline-offset:2px}

/* ---------- time bar ---------- */
.bar{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding-block:6px 4px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:1fr auto;grid-template-areas:"sub ctrls" "year ctrls" "track track";gap:2px 16px;align-items:center;position:relative;z-index:6}
.logo{position:absolute;top:4px;right:max(8px,env(safe-area-inset-right,0px));width:22px;height:22px;display:block;opacity:.9}
.logo:hover{opacity:1}
.logo img{width:22px;height:22px;display:block}
.ctrls{margin-right:22px}
.brand{grid-area:sub;padding-right:30px;min-width:0;margin:0;color:var(--muted);font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yearbox{grid-area:year;display:flex;align-items:baseline;gap:10px;min-width:0}
.year{font-family:var(--f-mono);font-weight:600;font-size:24px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.era{min-width:0;display:flex;gap:8px;align-items:baseline;overflow:hidden}
.era b{display:block;white-space:nowrap;font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.era span{display:block;color:var(--muted);font-size:12px;line-height:1.3;max-width:60ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls{grid-area:ctrls;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ctrls .sep{width:1px;height:24px;background:var(--line);margin:0 2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;height:32px;min-width:32px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px}
.btn:hover{border-color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn svg{width:14px;height:14px;fill:currentColor}
.btn.mode{height:36px;padding:0 14px;font-size:14px;font-weight:600;border-width:2px}
.btn.money-btn{border-color:var(--flow);color:var(--flow)}
.btn.money-btn[aria-pressed="true"]{background:var(--flow);border-color:var(--flow);color:#06121d}
.btn.death-btn{border-color:var(--harm);color:var(--harm)}
.btn.death-btn[aria-pressed="true"]{background:var(--harm);border-color:var(--harm);color:#1a0505}
.trackwrap{grid-area:track;position:relative;height:44px;touch-action:pan-y}
.eras{position:absolute;left:0;right:0;top:4px;height:14px;display:flex}
.eras div{height:100%;border-right:1px solid var(--surface);background:var(--surface2);font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;padding-left:4px;line-height:14px;font-family:var(--f-display);font-stretch:80%;letter-spacing:.03em;text-transform:uppercase}
.eras div.on{background:var(--state);color:var(--state-ink)}
.ticks{position:absolute;left:0;right:0;top:20px;height:12px;pointer-events:none}
.ticks i{position:absolute;top:0;width:1px;height:8px;background:var(--muted);opacity:.7}
.ticks i.tk-led{background:var(--led);height:12px;opacity:1}
.ticks i.tk-harm{background:var(--harm)}
.axis{position:absolute;left:0;right:0;top:33px;height:10px;font-family:var(--f-mono);font-size:10px;color:var(--muted);pointer-events:none}
.axis span{position:absolute;transform:translateX(-50%)}
#slider{position:absolute;left:0;right:0;top:12px;width:100%;margin:0;height:22px;background:transparent;-webkit-appearance:none;appearance:none}
#slider::-webkit-slider-runnable-track{height:22px;background:transparent}
#slider::-moz-range-track{height:22px;background:transparent}
#slider::-webkit-slider-thumb{-webkit-appearance:none;width:4px;height:26px;margin-top:-2px;background:var(--harm);border-radius:2px;box-shadow:0 0 0 3px var(--surface)}
#slider::-moz-range-thumb{width:4px;height:26px;background:var(--harm);border:0;border-radius:2px;box-shadow:0 0 0 3px var(--surface)}
.wheelhint{display:none}

/* ---------- body: sidebar + map ---------- */
.wrap{flex:1;min-height:0;display:flex;position:relative}
#side{flex:none;width:var(--sideW,200px);position:relative;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:5}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs{flex-wrap:wrap}
.tabs button{flex:1 1 50%;border:0;background:none;padding:7px 4px;font-size:11.5px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--harm)}
.pane{flex:1;overflow:auto;padding:10px 10px 70px;min-height:0;line-height:1.4;font-size:12.5px}
.pane[hidden]{display:none}
.closeSide{display:none}
.grip{position:absolute;top:0;right:-5px;width:10px;height:100%;cursor:col-resize;z-index:6;touch-action:none}
.grip:hover,.grip.on{background:linear-gradient(90deg,transparent 4px,var(--line) 4px,var(--line) 6px,transparent 6px)}
.sideToggle{position:absolute;top:50%;right:-15px;transform:translateY(-50%);width:15px;height:44px;border:1px solid var(--line);border-left:0;border-radius:0 6px 6px 0;background:var(--surface);color:var(--muted);font-size:11px;padding:0;z-index:7}
.sideToggle:hover{color:var(--ink)}
body.sideHidden #side{width:0;border-right:0}
body.sideHidden #side > :not(.sideToggle){display:none}
main{flex:1;position:relative;min-width:0}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map:active{cursor:grabbing}
.crumbs{position:absolute;top:10px;left:16px;display:flex;gap:6px;align-items:center;font-size:13px;z-index:3}
.crumbs button{border:0;background:none;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.crumbs .sep{color:var(--muted)} .crumbs .here{font-weight:600}
.zoomctl{position:absolute;right:max(30px,calc(env(safe-area-inset-right,0px) + 30px));bottom:calc(56px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:3}
.panel{position:absolute;z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.legend{right:max(4px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);writing-mode:vertical-rl;padding:6px 3px;font-size:9px;display:flex;flex-wrap:nowrap;gap:10px;color:var(--muted);opacity:.85}
.legend .sw{border-top:0;border-left:1.5px solid var(--ink);height:12px;width:0}
.legend .sw.d{border-left-style:dashed} .legend .sw.o{border-left-style:dotted}
.legend span{display:flex;align-items:center;gap:3px;white-space:nowrap}
.sw{display:inline-block;width:12px;height:0;border-top:1.5px solid var(--ink)} .sw.d{border-top-style:dashed} .sw.o{border-top-style:dotted}
.sq{display:inline-block;width:8px;height:8px;border-radius:2px}
.hint{position:absolute;top:10px;right:max(16px,env(safe-area-inset-right,0px));z-index:3;max-width:320px;padding:8px 32px 8px 10px;font-size:12px;line-height:1.4}
.hint button{position:absolute;right:4px;top:4px;border:0;background:none;width:24px;height:24px}
.moneysum{position:absolute;left:16px;bottom:56px;z-index:3;width:min(420px,calc(100% - 100px));padding:8px 12px;font-size:12px;line-height:1.4;display:none}
.moneysum .mx{float:right;border:0;background:none;font-size:12px;text-decoration:underline;padding:0}
.moneysum.min .row,.moneysum.min small{display:none}
body.money .moneysum{display:block}
.moneysum b{font-family:var(--f-display);font-stretch:85%;text-transform:uppercase;letter-spacing:.05em;font-size:12px}
.moneysum .row{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--faint);padding-top:3px;margin-top:3px}
.moneysum .num{font-family:var(--f-mono);font-weight:600}
.moneysum small{color:var(--muted);display:block;margin-top:4px}
.hoverlabel{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--surface);padding:4px 8px;border-radius:4px;font-size:12px;max-width:260px;opacity:0;transition:opacity .1s}
.hoverlabel.show{opacity:.95}

/* ---------- ticker ---------- */
.ticker{position:absolute;left:0;right:0;bottom:0;z-index:4;height:42px;display:flex;align-items:stretch;background:var(--state);color:var(--state-ink);overflow:hidden}
.tk-year{flex:none;display:flex;flex-direction:column;justify-content:center;padding:0 12px 0 16px;background:var(--harm);color:#fff;line-height:1}
body.money .tk-year{background:var(--flow);color:#06121d}
body.divest .tk-year{background:var(--harm);color:#1a0505}
.tk-year small{font-size:9px;text-transform:uppercase;letter-spacing:.08em;opacity:.9}
.tk-year b{font-family:var(--f-mono);font-size:16px}
.tk-viewport{flex:1;min-width:0;overflow:hidden;position:relative}
.tk-track{display:flex;width:max-content;height:100%;will-change:transform}
.tk-run{display:flex;align-items:center;padding-right:40px}
.tk-item{display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:inherit;font-size:13.5px;padding:0 22px 0 0;white-space:nowrap;height:42px}
.tk-item small{opacity:.7;font-size:11.5px}
.tk-item:hover{text-decoration:underline}
.tk-dot{width:8px;height:8px;border-radius:50%;background:var(--harm);flex:none}
.tk-dot.led{background:var(--led)} .tk-dot.flow{background:var(--flow)}
.tk-empty{padding:0 12px;font-size:13px;white-space:nowrap}
.tk-empty button{border:1px solid currentColor;background:none;color:inherit;border-radius:4px;padding:1px 8px;margin-left:8px;font-size:12px}

/* ---------- svg ---------- */
.box{fill:var(--surface);stroke:var(--line)}
.head{fill:var(--state)} .act.aboriginal .head{fill:var(--abo-head)} .act.private .head{fill:var(--corp-head)}
.ttl{fill:var(--state-ink);font-family:var(--f-display);font-stretch:78%;font-weight:700;font-size:18px}
.act.aboriginal .ttl,.act.aboriginal .sub{fill:var(--abo-ink)} .act.private .ttl,.act.private .sub{fill:var(--corp-ink)}
.sub{fill:var(--state-ink);opacity:.82;font-size:10.5px}
.ov-k{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.ov-v{fill:var(--ink);font-family:var(--f-mono);font-weight:600;font-size:21px;letter-spacing:-.03em}
.ov-c{fill:var(--muted);font-size:11px}
.ov-who{fill:var(--ink);font-size:11px;font-weight:600}
.ov-h{fill:var(--harm);font-family:var(--f-mono);font-size:10px;font-weight:600}
.ov-bar{fill:var(--flow);opacity:.8}
.ov-barbg{fill:var(--faint)}
.act{cursor:pointer;transition:opacity .3s}
.act.ghost{opacity:.14}
.act.changed .box{stroke:var(--harm);stroke-width:3}
.act.focus .box{stroke:var(--ink);stroke-width:2}
.act.hl .box{stroke:var(--flow);stroke-width:4}
.auth-box{fill:var(--ink)} .auth-t{fill:var(--surface);font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:18px}
.auth-w{fill:var(--surface);opacity:.8;font-size:11px}
.auth{cursor:pointer}
.conn{fill:none;stroke:var(--muted);stroke-width:1.2}
.conn-label{fill:var(--muted);font-size:10px;font-style:italic}
.band-label{fill:var(--ink);font-family:var(--f-display);font-stretch:90%;font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.band-sub{fill:var(--muted);font-size:10.5px}
.corpband{fill:var(--corp-band);opacity:.55}
.country{fill:var(--country)}
.country-label{fill:var(--country-ink);font-family:var(--f-display);font-stretch:90%;font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase}
.country-sub{fill:var(--country-ink);opacity:.8;font-size:10.5px}
.lk{fill:none;stroke:var(--ink);stroke-width:1.6;opacity:.5;cursor:pointer}
.lk.national{stroke-dasharray:6 4} .lk.gap{stroke-dasharray:1.5 4;stroke-linecap:round}
.lk:hover,.lk.focus{opacity:1;stroke-width:2.6}
.hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.lk-label{font-size:9.5px;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.badge{fill:var(--surface);stroke:var(--ink);cursor:pointer} .badge-t{font-family:var(--f-mono);font-size:8px;fill:var(--ink);pointer-events:none}
.fl{fill:none;stroke:var(--flow);opacity:.62;cursor:pointer}
.fl.cut{stroke:var(--harm);stroke-dasharray:7 5}
.fl:hover,.fl.focus{opacity:1}
.fl-label{font-family:var(--f-mono);font-size:10px;font-weight:600;fill:var(--flow);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.fl-label.cut{fill:var(--harm)}
body.money #gLinks{display:none} body:not(.money) #gFlows{display:none}
.cnote{font-size:11px;color:var(--muted);border-left:3px solid var(--harm);padding:3px 7px;margin:0 0 8px}

/* foreignObject (tier 3) */
.fo{font-family:var(--f-body);color:var(--ink)}
.chg,.mrow{display:block;box-sizing:border-box;height:27px;overflow:hidden;border:1px solid var(--faint);border-left:3px solid var(--line);border-radius:3px;background:var(--surface);padding:2px 5px;margin:0 0 2px;cursor:pointer;line-height:1.15}
.chg i,.mrow i,.oc i{display:block;font-style:normal;font-family:var(--f-mono);font-size:5.8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chg b,.mrow b{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;font-size:7.4px;font-weight:600}
.chg.harm{border-left-color:var(--harm)} .chg.led{border-left-color:var(--led)} .chg.data{border-left-color:var(--muted)}
.chg.now{background:color-mix(in srgb,var(--harm) 12%,var(--surface))}
.chg:hover,.mrow:hover,.oc:hover{border-color:var(--ink)}
.mrow{border-left-color:var(--flow)} .mrow.cut{border-left-color:var(--harm)}
.oc{display:block;box-sizing:border-box;height:44px;overflow:hidden;border:1px solid var(--ink);border-radius:3px;background:var(--surface2);padding:3px 5px;margin:0 0 2px;cursor:pointer;line-height:1.2}
.oc b{display:block;font-size:8px;font-family:var(--f-mono)}
.oc span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:6.6px}
.hm{display:block;box-sizing:border-box;height:44px;overflow:hidden;border:1px solid var(--harm);border-left:3px solid var(--harm);border-radius:3px;background:var(--surface2);padding:3px 5px;margin:0 0 2px;cursor:pointer;line-height:1.2}
.hm i{display:block;font-style:normal;font-family:var(--f-mono);font-size:5.8px;color:var(--muted)}
.hm b{display:block;font-size:7.4px}
.hm span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:6.6px}
.dim{opacity:.08!important}
.act.dimmed,.auth.dimmed{opacity:.22}
.funnel{margin:8px 0}
.funnel .fr{margin:0 0 6px;font-size:11.5px}
.funnel .fb{height:8px;background:var(--flow);border-radius:2px;margin-top:2px}
.funnel .fb.cut{background:var(--harm)}
.excards{display:flex;flex-direction:column;gap:3px}
.ex{background:var(--surface);border:1px solid var(--ink);border-radius:3px;padding:3px 5px;font-size:6.6px;line-height:1.25;cursor:pointer}
.ex b{display:block;font-size:7px} .ex i{font-style:normal;font-family:var(--f-mono);font-size:6px;color:var(--muted)}

/* ---------- details content (sidebar and phone pop-up) ---------- */
.fl-l{display:block;font-size:11px;color:var(--muted);margin:8px 0 3px}
#pSearch input,#pSearch select{width:100%;box-sizing:border-box;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:6px 7px;font:inherit;font-size:12.5px}
.qyears{display:flex;gap:6px;margin-top:6px}
.qout{margin-top:10px}
.qout .qn{font-size:11px;color:var(--muted);margin-bottom:4px}
.qout button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--faint);background:none;padding:6px 0;font-size:12.5px}
.qout button small{display:block;color:var(--muted);font-size:10.5px}
.qout mark{background:var(--harm);color:#1a0505;border-radius:2px;padding:0 1px}
.d .k{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.d h3{margin:4px 0 6px;font-family:var(--f-display);font-stretch:82%;font-weight:700;font-size:17px;line-height:1.15;text-wrap:balance}
.d p{margin:0 0 8px}
.d dl{display:grid;grid-template-columns:1fr;gap:1px 0;margin:0 0 8px;font-size:12px}
.d dd{margin:0 0 4px!important}
.d dt{color:var(--muted)} .d dd{margin:0}
.d .sa{border-left:3px solid var(--line);padding:4px 8px;margin:0 0 8px;font-size:12.5px;color:var(--muted)} .d .sa b{color:var(--ink);font-weight:600}
.d .ledbox{border-left:3px solid var(--led);background:color-mix(in srgb,var(--led) 16%,var(--surface));padding:4px 8px;margin:0 0 8px;font-size:12.5px}
.d .cav{border-left:3px solid var(--warn);padding:4px 8px;margin:0 0 8px;font-size:12px}
.d ul.tl{list-style:none;margin:0 0 8px;padding:0;font-size:12.5px}
.d ul.tl li{display:grid;grid-template-columns:34px 1fr;gap:6px;padding:3px 0;border-top:1px solid var(--faint)}
.d ul.tl li span:first-child{font-family:var(--f-mono);color:var(--muted)}
.d button.lnk,.d ul.tl li button{border:0;background:none;padding:0;text-align:left;text-decoration:underline;text-underline-offset:2px}
.d .src{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:6px}
.d .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid var(--faint)}
.d .acts button,.d .acts a{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:4px 9px;font-size:12px;text-decoration:none}
.d .fix{margin-top:8px;padding:8px;border:1px dashed var(--line);border-radius:6px;font-size:12px}
.d .fix code{font-family:var(--f-mono);font-size:12px;user-select:all;background:var(--faint);padding:1px 4px;border-radius:3px}
.d .fix textarea{width:100%;box-sizing:border-box;margin:6px 0;font:12px/1.4 var(--f-mono);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px;resize:vertical;min-height:96px}
.chip{display:inline-block;font-size:10px;line-height:16px;padding:0 6px;border-radius:9px;border:1px solid currentColor;font-family:var(--f-mono);white-space:nowrap;font-style:normal}
.chip.v{color:var(--ok)} .chip.t{color:var(--warn)} .chip.s{color:var(--led)} .chip.c{color:var(--muted)}
.empty-d{color:var(--muted);font-size:13px}
.empty-d h3{color:var(--ink)}
.saved{list-style:none;margin:0;padding:0}
.saved li{display:grid;grid-template-columns:1fr auto;gap:6px;border-top:1px solid var(--faint);padding:6px 0}
.saved li button.open{border:0;background:none;text-align:left;padding:0}
.saved li small{display:block;color:var(--muted);font-size:11px}
.saved li button.rm{border:0;background:none;color:var(--muted);width:26px;height:26px}
.power h3{margin:0 0 2px;font-family:var(--f-display);font-stretch:82%;font-size:18px}
.power .lede{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.power h4{margin:14px 0 6px;font-family:var(--f-display);font-stretch:85%;text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:5px}
.tile{border:1px solid var(--faint);border-radius:6px;padding:6px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile .av{width:30px;height:30px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;font-weight:600}
.tile b{font-size:11.5px;line-height:1.2}
.tile small{font-size:10px;color:var(--muted);line-height:1.2}
.tile.now{border-color:var(--harm);box-shadow:inset 0 0 0 1px var(--harm)}
.tile.now .av{background:var(--harm);color:#fff;border-color:var(--harm)}
.tile.past{opacity:.72}

/* phone pop-up */
#pop{position:fixed;z-index:20;left:12px;right:12px;bottom:54px;max-height:62vh;overflow:auto;background:var(--surface);border:1px solid var(--ink);border-radius:10px;box-shadow:var(--shadow);padding:14px 16px;display:none}
#pop.show{display:block}
#pop .x{position:absolute;right:6px;top:6px;border:0;background:none;width:30px;height:30px;font-size:18px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;padding:16px;text-align:center}

@media (max-width:900px){
  #side{position:fixed;left:0;top:0;bottom:0;width:min(380px,90vw);transform:translateX(-102%);transition:transform .25s;z-index:25;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
  #side.open{transform:none}
  .grip,.sideToggle{display:none}
  body.sideHidden #side{width:min(380px,90vw)} body.sideHidden #side > :not(.sideToggle){display:revert}
  .closeSide{display:block;border:0;background:none;padding:10px 12px;font-size:18px;flex:none!important}
  .legend{display:none}
}
@media (min-width:901px){ #sideBtn{display:none} #pop{display:none!important} }
@media (max-width:720px){
  .bar{grid-template-columns:1fr;grid-template-areas:"sub" "ctrls" "year" "track"}
  .ctrls{justify-content:flex-start;gap:4px}
  .btn{height:30px;min-width:30px;padding:0 8px;font-size:12px}
  .btn.mode{height:32px;padding:0 10px;font-size:13px}
  .ctrls .sep{display:none}
  .era span{display:none}
  .moneysum{bottom:52px;left:8px;right:8px;width:auto;font-size:11.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => (v === "" || v == null) ? null : +v;
const yearOf = d => d ? +String(d).slice(0, 4) : null;
const LIMB = {a:"Killing members of the group (a)", b:"Serious bodily or mental harm (b)", c:"Conditions of life (c)", e:"Forcibly transferring children (e)"};
const KIND = {nt:"NT evidence", national:"National evidence, NT data needed", gap:"Gap: logical link, no NT figure yet"};
const BAND_LABEL = {state:"Government department", private:"Company, contractor or charity", aboriginal:"First Nations controlled"};
const isDesk = () => matchMedia("(min-width:901px)").matches;

const COLW = 190, BOXW = 170, X0 = 40, CE = 29, CO = 46, HEAD = 74;
const Y_AUTH = 26, AUTH_H = 66, Y_SEC = 196;
let W = 0, H = 0, Y_PRIV = 0, Y_COUNTRY = 0, COUNTRY_H = 0;

const state = {year:2026, k:1, kFit:1, money:false, divest:false, locked:null, playing:null, authW:{}, trace:null};
let D = {}, svg, root, zoom, gConn, gLinks, gFlows, gAuth, gAct, gBands;

const files = ["config","authorities","eras","actors","mechanisms","events","links","examples","flows","outcomes","officeholders","harm"];
Promise.all(files.map(f => d3.csv("data/" + f + ".csv"))).then(res => {
  files.forEach((f,i) => D[f] = res[i]);
  prepare(); build(); setYear(state.year, true); fit(false); renderSaved(); showDefault();
  $("loading").remove();
  if (!isDesk()) $("hintText").textContent = "Pinch to zoom into a section. Tap anything for details. Open Panel for saved items and who held power.";
}).catch(err => { $("loading").textContent = "The data tables did not load. Serve this folder over the web (for example GitHub Pages) so the browser can read data/*.csv."; console.error(err); });

function prepare(){
  const cfg = {}; D.config.forEach(r => cfg[r.key] = r.value); D.cfg = cfg;
  $("siteSub").textContent = cfg.subtitle || "";
  D.y0 = +cfg.start_year || 1824; D.y1 = +cfg.end_year || 2026; state.year = +cfg.default_year || D.y1;
  $("slider").min = D.y0; $("slider").max = D.y1;
  const range = r => { r.start = num(r.start_year); r.end = num(r.end_year); return r; };
  ["authorities","eras","actors","mechanisms","links"].forEach(t => D[t].forEach(range));
  D.events.forEach(e => { e.y = +e.year; });
  D.examples.forEach(x => x.y = +x.year);
  D.flows.forEach(f => { f.y = +f.year; f.ye = num(f.end_year) ?? f.y; f.amt = num(f.amount_aud); });
  D.outcomes.forEach(o => o.y = +o.year);
  D.officeholders.forEach(h => { h.sy = yearOf(h.start); h.ey = h.end ? yearOf(h.end) : null; });
  D.harm.forEach(d => { d.y = +d.year; d.ye = num(d.end_year) ?? d.y; d.n = num(d.count); });
  D.actors.forEach(a => {
    a.col = +a.col;
    a.eraLabels = (a.era_labels || "").split("|").filter(Boolean).map(t => { const [r, l] = t.split(/:(.+)/); const [p,q] = r.split("-"); return {a:+p, b:q ? +q : 9999, l}; });
    a.events = D.events.filter(e => e.section === a.id).sort((p,q) => q.y - p.y || String(q.date).localeCompare(String(p.date)));
    a.fl = D.flows.filter(f => f.from === a.id || f.to === a.id);
    a.oc = D.outcomes.filter(o => o.actor === a.id);
    a.mechs = D.mechanisms.filter(m => m.section === a.id);
    a.hm = D.harm.filter(d => d.actor === a.id).sort((p,q) => q.ye - p.ye);
    a.h = Math.max(196, HEAD + a.events.length * CE + a.hm.length * CO + 34, HEAD + a.fl.length * CE + a.oc.length * CO + 40, HEAD + a.hm.length * CO + 40);
  });
  const nMax = d3.max(["state","private","aboriginal"], b => d3.max(D.actors.filter(a => a.band === b), a => a.col) || 0);
  W = X0 * 2 + (nMax - 1) * COLW + BOXW;
  ["state","private","aboriginal"].forEach(b => { const n = d3.max(D.actors.filter(a => a.band === b), a => a.col) || 0, off = (W - ((n - 1) * COLW + BOXW)) / 2;
    D.actors.filter(a => a.band === b).forEach(a => { a.x = off + (a.col - 1) * COLW; a.cx = a.x + BOXW/2; }); });
  D.byId = Object.fromEntries(D.actors.map(a => [a.id, a]));
  const band = b => D.actors.filter(a => a.band === b), maxH = b => d3.max(band(b), a => a.h) || 0;
  band("state").forEach(a => a.y = Y_SEC);
  Y_PRIV = Y_SEC + maxH("state") + 200;
  band("private").forEach(a => a.y = Y_PRIV + 46);
  Y_COUNTRY = Y_PRIV + 46 + maxH("private") + 40;
  band("aboriginal").forEach(a => a.y = Y_COUNTRY + 54);
  COUNTRY_H = maxH("aboriginal") + 80; H = Y_COUNTRY + COUNTRY_H + 30;
  D.eventYears = [...new Set(D.events.map(e => e.y).concat(D.flows.map(f => f.y)))].sort((a,b) => a-b);
  D.maxAmt = d3.max(D.flows.filter(f => f.amt && !isDiv(f) && f.per === "year"), f => f.amt) || 1;
}
const active = (r, y) => (r.start == null || r.start <= y) && (r.end == null || y <= r.end);
const labelAt = (a, y) => (a.eraLabels.find(e => e.a <= y && y <= e.b) || {}).l || a.label;
const eraAt = y => D.eras.find(e => active(e, y));
function parentAt(a, y){ if (a.band !== "state") return null; if (y < 1863) return "crown"; if (y < 1911) return "sa"; return a.parent; }
function authAt(id, y){ return D.authorities.find(a => a.id === id && active(a, y)); }
function authPos(id){
  const st = D.actors.filter(a => a.band === "state"), cw = st.filter(a => a.parent === "cwlth"), nt = st.filter(a => a.parent === "ntg");
  const mid = arr => (d3.min(arr, s => s.x) + d3.max(arr, s => s.x + BOXW)) / 2;
  if (id === "cwlth") return {x: mid(cw), y: Y_AUTH}; if (id === "ntg") return {x: mid(nt), y: Y_AUTH};
  return {x: W/2, y: Y_AUTH};
}
const holdersAt = (y, pred) => D.officeholders.filter(h => h.sy <= y && (h.ey == null || h.ey >= y) && pred(h));
const fmt$ = v => v == null ? "amount not public" : v >= 1e9 ? "$" + (v/1e9).toFixed(2).replace(/\.?0+$/,"") + "B" : v >= 1e6 ? "$" + (v/1e6).toFixed(1).replace(/\.0$/,"") + "M" : v >= 1000 ? "$" + d3.format(",.0f")(v) : "$" + d3.format(",.2f")(v);
const isDiv = f => f.kind === "cut" || f.kind === "diverted" || f.kind === "withheld";
const flowsAt = y => D.flows.filter(f => f.y <= y && y <= f.ye);
const shownFlows = y => flowsAt(y).filter(f => state.divest ? isDiv(f) : !isDiv(f));
const chip = s => s === "verified" ? '<i class="chip v">verified</i>' : s === "testimony" ? '<i class="chip s">testimony</i>' : s === "reference" ? '<i class="chip c">reference</i>' : s ? '<i class="chip t">' + esc(s) + '</i>' : "";
const src = (t, u, st) => (t || u) ? '<div class="src">' + chip(st) + (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(t || u) + '</a>' : '<span>' + esc(t) + '</span>') + '</div>' : "";
const isHarm = e => ["violence","death","cut","law","invasion"].includes(e.type) && e.aboriginal_led !== "yes";
function fitText(t, n){ t = String(t || ""); return t.length > n ? t.slice(0, n - 1).trimEnd() + "…" : t; }
function wrapWords(t, n){ const out = []; let cur = ""; String(t).split(" ").forEach(w => { if ((cur + " " + w).trim().length > n && cur){ out.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }); if (cur) out.push(cur); return out; }
const initials = n => n.split(/\s+/).filter(w => /^[A-Z]/.test(w)).map(w => w[0]).slice(0, 2).join("");

/* ---------------- build ---------------- */
function build(){
  svg = d3.select("#map");
  const defs = svg.append("defs");
  defs.append("marker").attr("id","arr").attr("viewBox","0 0 10 10").attr("refX",8).attr("refY",5).attr("markerWidth",7).attr("markerHeight",7).attr("orient","auto-start-reverse")
    .append("path").attr("d","M0,0L10,5L0,10z").style("fill","var(--ink)");
  root = svg.append("g");
  gBands = root.append("g"); gConn = root.append("g"); gLinks = root.append("g").attr("id","gLinks");
  gAuth = root.append("g"); gAct = root.append("g"); gFlows = root.append("g").attr("id","gFlows");

  gBands.append("rect").attr("class","corpband").attr("x",0).attr("y",Y_PRIV).attr("width",W).attr("height",Y_COUNTRY - Y_PRIV - 14).attr("rx",6);
  gBands.append("text").attr("class","band-label").attr("text-anchor","middle").attr("x",W/2).attr("y",Y_PRIV + 22).text("Companies, contractors and charities");
  gBands.append("text").attr("class","band-sub").attr("text-anchor","middle").attr("x",W/2).attr("y",Y_PRIV + 37).text("Paid by governments, or extracting from Country with government approval.");
  gBands.append("rect").attr("class","country").attr("x",0).attr("y",Y_COUNTRY).attr("width",W).attr("height",COUNTRY_H).attr("rx",6);
  gBands.append("text").attr("class","country-label").attr("text-anchor","middle").attr("x",W/2).attr("y",Y_COUNTRY + 24).text(D.cfg.country_label || "Country: sovereignty never ceded");
  gBands.append("text").attr("class","country-sub").attr("text-anchor","middle").attr("x",W/2).attr("y",Y_COUNTRY + 40).text("Organisations controlled by First Nations people, on Country that was never ceded, and what they achieve when resourced.");

  gAuth.selectAll("g").data(["crown","sa","cwlth","ntg"]).join("g").attr("class","auth").each(function(){
    const g = d3.select(this);
    g.append("rect").attr("class","auth-box").attr("rx",4).attr("height",AUTH_H);
    g.append("text").attr("class","auth-t").attr("y",28).attr("text-anchor","middle");
    g.append("text").attr("class","auth-w").attr("y",48).attr("text-anchor","middle");
  }).on("pointerenter", (ev,id) => hover(ev, "G:" + id)).on("pointermove", moveLabel).on("pointerleave", leave)
    .on("click", (ev,id) => { ev.stopPropagation(); choose(ev, "G:" + id); });

  const g = gAct.selectAll("g.act").data(D.actors).join("g").attr("class", a => "act " + a.band).attr("transform", a => `translate(${a.x},${a.y})`);
  g.append("rect").attr("class","box").attr("width",BOXW).attr("height", a => a.h).attr("rx",5);
  g.append("path").attr("class","head").attr("d", `M0,5a5,5 0 0 1 5,-5h${BOXW-10}a5,5 0 0 1 5,5v59h-${BOXW}z`);
  g.append("text").attr("class","ttl").attr("x",10).attr("y",20);
  g.append("text").attr("class","sub").attr("x",10).attr("y",56);
  const ov = g.append("g").attr("class","overview");
  ov.append("text").attr("class","ov-k").attr("x",10).attr("y",88);
  ov.append("text").attr("class","ov-v").attr("x",10).attr("y",112);
  ov.append("rect").attr("class","ov-barbg").attr("x",10).attr("y",120).attr("height",5).attr("width",BOXW-20);
  ov.append("rect").attr("class","ov-bar").attr("x",10).attr("y",120).attr("height",5);
  ov.append("text").attr("class","ov-c").attr("x",10).attr("y",142);
  ov.append("text").attr("class","ov-who").attr("x",10).attr("y",152);
  ov.append("text").attr("class","ov-k ov-n").attr("x",10).attr("y",182);
  ov.append("text").attr("class","ov-h").attr("x",10).attr("y",166);
  g.append("foreignObject").attr("class","fo3").attr("x",6).attr("y",70).attr("width",BOXW-12).attr("height", a => a.h - 76).append("xhtml:div").attr("class","fo inner");
  g.on("pointerenter", (ev,a) => hover(ev, "A:" + a.id)).on("pointermove", moveLabel).on("pointerleave", leave)
   .on("click", (ev,a) => { ev.stopPropagation(); zoomToActor(a); choose(ev, "A:" + a.id); });

  zoom = d3.zoom().scaleExtent([0.12, 9]).on("zoom", ev => { root.attr("transform", ev.transform); state.k = ev.transform.k; state.t = ev.transform; semantic(); crumbs(); });
  svg.call(zoom).on("dblclick.zoom", null);

function fundingFor(a, y){
  if (state.divest){ const dv = shownFlows(y).filter(f => f.to === a.id || f.from === a.id); if (!dv.length) return null;
    return {amt: d3.sum(dv, f => f.amt || 0) || null, label: "Divested", note: dv.map(f => f.label).join("; "), cut: true}; }
  const inn = flowsAt(y).filter(f => f.to === a.id && !isDiv(f));
  const annual = inn.filter(f => f.per === "year" && f.amt);
  if (annual.length) return {amt: d3.sum(annual, f => f.amt), label: "Funding in " + y, note: annual.map(f => f.label).join("; ")};
  const other = inn.filter(f => f.amt).sort((p,q) => q.amt - p.amt)[0];
  if (other) return {amt: other.amt, label: "Funding, " + other.per, note: other.label};
  const out = flowsAt(y).filter(f => f.from === a.id && f.amt && !isDiv(f)).sort((p,q) => q.amt - p.amt)[0];
  if (out) return {amt: out.amt, label: "Pays out, " + out.per, note: out.label};
  const cut = flowsAt(y).find(f => (f.to === a.id || f.from === a.id) && isDiv(f));
  if (cut) return {amt: cut.amt, label: "Cut in " + cut.y, note: cut.label, cut: true};

}

/* follow the money: trace every flow connected upstream and downstream */
function traceFrom(key){
  const y = state.year, fl = shownFlows(y).filter(f => f.from);
  const [t, id] = key.split(/:(.+)/); let start = [];
  if (t === "F"){ const f = D.flows.find(x => x.id === id); if (!f) return null; start = [f.from, f.to].filter(Boolean); }
  else if (t === "A" || t === "G") start = [id]; else return null;
  const nodes = new Set(start), flows = new Set();
  if (t === "F") flows.add(id);
  let up = [...start], dn = [...start];
  while (up.length){ const n = up.pop(); fl.filter(f => f.to === n).forEach(f => { flows.add(f.id); if (!nodes.has(f.from)){ nodes.add(f.from); up.push(f.from); } }); }
  while (dn.length){ const n = dn.pop(); fl.filter(f => f.from === n).forEach(f => { flows.add(f.id); if (f.to && !nodes.has(f.to)){ nodes.add(f.to); dn.push(f.to); } }); }
  return flows.size ? {nodes, flows} : null;
}
function applyTrace(){
  const tr = state.money && state.trace;
  gFlows.selectAll("g.flg").classed("dim", f => !!tr && !tr.flows.has(f.id));
  gAct.selectAll(".act").classed("dimmed", a => !!tr && !tr.nodes.has(a.id));
  gAuth.selectAll(".auth").classed("dimmed", id => !!tr && !tr.nodes.has(id));
}
function funnelHtml(tr){
  if (!tr) return "";
  const fl = D.flows.filter(f => tr.flows.has(f.id));
  const depth = {}; const roots = [...tr.nodes].filter(n => !fl.some(f => f.to === n));
  const q = roots.map(n => [n, 0]); while (q.length){ const [n, d] = q.shift(); if (depth[n] != null && depth[n] <= d) continue; depth[n] = d; fl.filter(f => f.from === n && f.to).forEach(f => q.push([f.to, d + 1])); }
  fl.sort((p,q2) => (depth[p.from] ?? 0) - (depth[q2.from] ?? 0) || (q2.amt || 0) - (p.amt || 0));
  const max = d3.max(fl, f => f.amt) || 1;
  return `<div class="funnel"><div class="k"><span>Follow the money</span><span>${state.year}</span></div>` + fl.map(f => `<div class="fr"><button class="lnk" data-key="F:${f.id}">${esc(nameOf(f.from))} → ${f.to ? esc(nameOf(f.to)) : "not traced further"}</button><br>${isDiv(f) ? "Cut " : ""}${fmt$(f.amt)} ${f.per && f.per !== "year" ? "(" + esc(f.per) + ")" : "a year"} · ${esc(f.label)}<div class="fb ${isDiv(f) ? "cut" : ""}" style="width:${f.amt ? Math.max(2, Math.sqrt(f.amt / max) * 100) : 2}%"></div></div>`).join("") +
    `<p style="font-size:11px;color:var(--muted)">Bars use a square-root scale so small amounts stay visible. Where a line ends, the money is spent inside government or the recipient is not public.</p></div>`;
}
function changesHtml(a, y){
  const evs = a.events.filter(e => e.y <= y), hs = a.hm.filter(d => d.y <= y);
  if (!evs.length && !hs.length) return '<div class="chg data"><i>no record</i><b>No change recorded yet</b></div>';
  const items = evs.map(e => ({y: e.y, e})).concat(hs.map(d => ({y: d.ye, d}))).sort((p,q) => q.y - p.y);
  return items.map(({e, d}) => d ? `<div class="hm" data-key="D:${d.id}"><i>content note · ${esc(d.kind)} · ${d.y === d.ye ? d.y : d.y + "–" + d.ye} · ${esc(d.scope)}</i><b>${esc(d.measure)}</b><span>${esc(d.value)}</span></div>` : `<div class="chg ${e.aboriginal_led === "yes" ? "led" : isHarm(e) ? "harm" : "data"} ${e.y === y ? "now" : ""}" data-key="E:${e.id}"><i>${e.y} · ${esc(e.type)}${e.figure ? " · " + esc(e.figure) : ""}${e.status !== "verified" ? " · " + esc(e.status) : ""}</i><b>${esc(e.title)}</b></div>`).join("");
}
function moneyHtml(a, y){
  const fl = a.fl.filter(f => f.y <= y && (state.divest ? isDiv(f) : !isDiv(f))).sort((p,q) => q.y - p.y), oc = state.divest ? [] : a.oc.filter(o => o.y <= y);
  const rows = fl.map(f => { const dir = f.to === a.id ? "from " + nameOf(f.from) : "to " + (f.to ? nameOf(f.to) : "—");
    return `<div class="mrow ${isDiv(f) ? "cut" : ""}" data-key="F:${f.id}"><i>${f.y}${f.ye !== f.y ? "–" + f.ye : ""} · ${esc(f.kind)} · ${esc(dir)}</i><b>${isDiv(f) ? "Cut " : ""}${fmt$(f.amt)} ${esc(f.label)}</b></div>`; }).join("");
  const ocs = oc.map(o => `<div class="oc" data-key="O:${o.id}"><i>Result · ${o.y}</i><b>${esc(o.value)}</b><span>${esc(o.measure)}${o.cost ? " · cost " + esc(o.cost) : ""}</span></div>`).join("");
  return (ocs + rows) || '<div class="mrow"><i>no record</i><b>No money figure recorded yet</b></div>';
}
function nameOf(id){ const a = D.byId[id]; if (a) return fitText(labelAt(a, state.year), 30); const g = authAt(id, state.year) || D.authorities.find(x => x.id === id); return g ? g.label : id; }

function renderLinks(y){
  const lks = D.links.filter(l => active(l, y) && D.byId[l.from] && D.byId[l.to] && active(D.byId[l.from], y) && active(D.byId[l.to], y));
  const yb = Y_SEC + d3.max(D.actors.filter(a => a.band === "state"), a => a.h);

/* ticker: moved by script so it runs on every phone */
const tick = {x:0, paused:0, last:0};
function tickerLoop(){
  const tk = $("ticker"), track = $("tkTrack");
  tk.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") tick.paused = Infinity; });
  tk.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") tick.paused = 0; });
  tk.addEventListener("touchstart", () => tick.paused = performance.now() + 4000, {passive:true});
  tk.addEventListener("focusin", () => tick.paused = Infinity); tk.addEventListener("focusout", () => tick.paused = 0);
  const step = t => {
    const dt = tick.last ? Math.min(64, t - tick.last) : 16; tick.last = t;
    if (!tk.classList.contains("still") && t > tick.paused && track.firstChild){
      const w = track.firstChild.getBoundingClientRect().width;
      if (w > 0){ tick.x -= dt * 0.05; if (-tick.x >= w) tick.x += w; track.style.transform = `translateX(${tick.x}px)`; }
    }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

  if (t === "E"){ const e = D.events.find(x => x.id === id); return e && {title: e.title, kind: "Change, " + e.y, actor: D.byId[e.section], html: () => eventHtml(e)}; }
  if (t === "L"){ const l = D.links.find(x => x.id === id); return l && {title: l.label, kind: "Link", html: () => linkHtml(l)}; }
  if (t === "F"){ const f = D.flows.find(x => x.id === id); return f && {title: (isDiv(f) ? "Cut: " : "") + f.label, kind: "Money, " + f.y, actor: D.byId[f.to] || D.byId[f.from], html: () => flowHtml(f)}; }

  if (t === "X"){ const x = D.examples.find(v => v.id === id); return x && {title: x.title, kind: "Example", html: () => exampleHtml(x)}; }
  if (t === "D"){ const d = D.harm.find(x => x.id === id); return d && {title: d.measure, kind: "Death or harm", actor: D.byId[d.actor], html: () => harmDetail(d)}; }

  const evs = a ? a.events.filter(e => e.y >= h.sy && e.y <= (h.ey ?? 9999)) : D.events.filter(e => { const x = D.byId[e.section]; return x && x.band === "state" && x.parent === h.actor && e.y >= h.sy && e.y <= (h.ey ?? 9999) && (e.type === "law" || e.type === "policy" || e.type === "cut"); });
  return head(h.role, h.party, h.person) + `<dl><dt>In office</dt><dd>${esc(h.start)} to ${esc(h.end || "now")}</dd><dt>Responsible for</dt><dd>${esc(a ? a.label : g ? g.label : h.actor)}</dd></dl>` +
    (h.note ? `<p>${esc(h.note)}</p>` : "") +
    (evs.length ? `<p style="font-size:12px;color:var(--muted)">Laws, policies and cuts recorded while they held office:</p><ul class="tl">${evs.map(e => `<li><span>${e.y}</span><span><button data-key="E:${e.id}">${esc(e.title)}</button></span></li>`).join("")}</ul>` : "") + src(h.source_title, h.source_url, h.status);
}
function harmDetail(d){
  return head(d.kind + " · " + d.scope, d.y === d.ye ? d.y : d.y + "–" + d.ye, d.measure) + `<div class="cnote">Content note: death and injury.</div><p><b>${esc(d.value)}</b></p>` + (d.note ? `<div class="cav">${esc(d.note)}</div>` : "") +
    (D.byId[d.actor] ? `<dl><dt>System</dt><dd>${esc(nameOf(d.actor))}</dd></dl>` : "") + src(d.source_title, d.source_url, d.status);
}
function exampleHtml(x){ return head(x.kind + " · example", x.y, x.title) + `<p>${esc(x.text)}</p><dl><dt>Consent</dt><dd>${esc(x.consent)}</dd></dl>` + src(x.source_title, x.source_url, x.kind === "composite" ? "composite" : "verified"); }
function authHtml(id){
  const y = state.year, a = authAt(id, y) || D.authorities.find(v => v.id === id), who = holdersAt(y, h => h.actor === id);
  return head("Government", (a.start ?? "") + "–" + (a.end ?? "now"), a.label) + `<p>${esc(a.summary)}</p>` + (who.length ? `<dl><dt>In office in ${y}</dt><dd>${who.map(h => `<button class="lnk" data-key="H:${h.id}">${esc(h.person)}</button> (${esc(h.role)})`).join("; ")}</dd></dl>` : "") + src(a.source_title, a.source_url, "verified");
}
function aboutHtml(){
  return head("About", "", "How to read this map") +
    `<p>Top row: the governments. Second row: the departments each one runs, showing their funding when zoomed out and every recorded change when zoomed in. Below them: the companies, contractors and charities paid by or working alongside government. At the bottom: First Nations controlled organisations, and what they achieve.</p>
     <p>Deaths and injuries recorded in each system appear in its list of changes, marked with a content note, and as a red count on the box.</p>
     <p><b>Divested</b> turns the page red and shows money cut, withheld or diverted. <b>Funded</b> turns the page blue and shows only money: who pays whom, what was cut, and the results recorded for each kind of spending, with caveats where comparisons are not like-for-like.</p>
     <p><b>Who held power</b> lists every person recorded in these offices up to the year you choose. Open a change to see who was in office.</p>
     <p>Sentences name the institution that acts and what it takes. Government positions are labelled State's account. Every item carries a status: verified (linked source), to source, testimony or reference. All content comes from CSV tables in the data folder.</p>`;
}
function showDefault(){
  if (state.locked) return;
  $("pDetails").innerHTML = `<div class="empty-d">${head("Details", state.year, state.divest ? "Divested" : state.money ? "Funded" : "Hover over anything on the map")}<p>${state.divest
    ? "The map now shows money cut, withheld or spent elsewhere: GST assessed for Aboriginal need, ranger grants, rehab, bilingual schooling, YiSSA, and promised funding not paid. Click any line or box to follow it."
    : state.money
    ? "The map now shows money paid: blue lines are payments (thicker means more). Zoom into a box to see each payment and the results recorded for it. Click any box or line to follow only that money from the Commonwealth down."
    : "Hover over a government, department, organisation, change or arrow to read about it here. Click to keep it here and add it to Saved. Scroll on the map to zoom in; scroll on the time bar to move through the years."}</p></div>`;
}

const lbl = $("hoverLabel");
function hover(ev, key){
  if (!isDesk()) return;
  const it = resolve(key); if (!it) return;
  lbl.textContent = it.title; lbl.classList.add("show"); moveLabel(ev);
  if (!state.locked){ $("pDetails").innerHTML = it.html(); tab("pDetails"); }
}
function moveLabel(ev){ if (!isDesk()) return; lbl.style.left = Math.min(innerWidth - 270, ev.clientX + 14) + "px"; lbl.style.top = (ev.clientY + 16) + "px"; }
function leave(){ lbl.classList.remove("show"); }
function choose(ev, key, noSave){
  const it = resolve(key); if (!it) return;
  if (!noSave) save(key, it);
  state.trace = state.money ? traceFrom(key) : null; applyTrace();
  state.locked = key; showDetails(key);
  if (!isDesk()){ $("popBody").innerHTML = details(key); wire($("popBody")); $("pop").classList.add("show"); $("side").classList.remove("open"); }
}
function showDetails(key, refresh){
  if (!isDesk() && refresh && $("pop").classList.contains("show")){ $("popBody").innerHTML = details(key); wire($("popBody")); }
  $("pDetails").innerHTML = details(key); wire($("pDetails"));
  if (!refresh) tab("pDetails");
  const it = resolve(key); gAct.selectAll(".act").classed("hl", a => !!it && it.actor === a);
}
function details(key){
  const it = resolve(key); if (!it) return "";
  const savedNow = getSaved().some(s => s.key === key);
  const email = D.cfg.contact_email || "", subj = `Correction ${key} (${state.year}): ${it.title}`;
  const msg = `Item: ${key}\nYear viewed: ${state.year}\nTitle: ${it.title}\n\nWhat should change:\n\nSource (link or document):\n\nCan we credit you? (yes/no, name):\n`;
  return (state.trace ? funnelHtml(state.trace) : "") + it.html() + `<div class="acts"><button data-save="${esc(key)}">${savedNow ? "Saved ✓ (remove)" : "Save"}</button><button data-unlock>Release</button><button data-fix>Suggest a correction</button></div>
    <div class="fix" hidden><div>${esc(D.cfg.contact_note || "")}</div><div style="margin-top:6px">Send to <code>${esc(email)}</code></div>
    <textarea aria-label="Message to copy">${esc(msg)}</textarea>
    <div class="acts" style="border:0;margin:0;padding:0"><button data-copy="msg" data-label="Copy message">Copy message</button><button data-copy="email" data-label="Copy address">Copy address</button><a href="mailto:${esc(email)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Open in email app</a></div></div>`;
}
function wire(el){
  el.querySelectorAll("[data-key]").forEach(b => b.onclick = ev => { ev.stopPropagation(); choose(ev, b.dataset.key, true); });
  const sv = el.querySelector("[data-save]"); if (sv) sv.onclick = () => { const k = sv.dataset.save; if (getSaved().some(s => s.key === k)) unsave(k); else save(k, resolve(k)); showDetails(k, true); };
  const ul = el.querySelector("[data-unlock]"); if (ul) ul.onclick = () => { unlock(); $("pop").classList.remove("show"); };
  const fx = el.querySelector("[data-fix]"); if (fx) fx.onclick = () => { const b = el.querySelector(".fix"); b.hidden = !b.hidden; };
  el.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
    const t = b.dataset.copy === "email" ? (D.cfg.contact_email || "") : el.querySelector(".fix textarea").value;
    const done = () => { b.textContent = "Copied"; setTimeout(() => b.textContent = b.dataset.label, 1400); };
    const sel = () => { const ta = el.querySelector(".fix textarea"); ta.focus(); ta.select(); };
    navigator.clipboard ? navigator.clipboard.writeText(t).then(done).catch(sel) : sel();
  });
}
function unlock(){ state.locked = null; state.trace = null; if (gAct){ gAct.selectAll(".act").classed("hl", false); applyTrace(); } showDefault(); }

const KEY = "nt-map-saved";
function getSaved(){ try { return JSON.parse(localStorage.getItem(KEY) || "null") || state._saved || []; } catch(e){ return state._saved || []; } }
function setSaved(v){ state._saved = v; try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} renderSaved(); }
function save(key, it){ const s = getSaved().filter(x => x.key !== key); s.unshift({key, title: it.title, kind: it.kind, year: state.year}); setSaved(s); }
function unsave(key){ setSaved(getSaved().filter(x => x.key !== key)); }
function renderSaved(){
  const s = getSaved(); $("savedN").textContent = s.length ? "(" + s.length + ")" : "";
  $("pSaved").innerHTML = `<div class="d">${head("Saved", "this browser only", s.length ? s.length + " saved items" : "Nothing saved yet")}</div>` +
    (s.length ? `<ul class="saved">${s.map(x => `<li><button class="open" data-key="${esc(x.key)}">${esc(x.title)}<small>${esc(x.kind || "")} · viewed in ${x.year}</small></button><button class="rm" data-rm="${esc(x.key)}" aria-label="Remove">×</button></li>`).join("")}</ul>
      <div class="d"><div class="acts"><button id="copyAll">Copy all with sources</button><button id="clearAll">Clear all</button></div></div>`
      : `<p class="empty-d">Click anything on the map to save it here. Saved items stay in this browser only.</p>`);
  $("pSaved").querySelectorAll("[data-key]").forEach(b => b.onclick = ev => { const it = resolve(b.dataset.key); if (it && it.actor) zoomToActor(it.actor); choose(ev, b.dataset.key, true); });
  $("pSaved").querySelectorAll("[data-rm]").forEach(b => b.onclick = () => unsave(b.dataset.rm));
  const ca = $("copyAll"); if (ca) ca.onclick = () => {
    const txt = s.map(x => { const it = resolve(x.key); const tmp = document.createElement("div"); tmp.innerHTML = it ? it.html() : ""; const links = [...tmp.querySelectorAll("a")].map(a => a.href); return `${x.title} (${x.kind})\n${tmp.textContent.replace(/\s+/g, " ").trim()}\n${links.join("\n")}`; }).join("\n\n");
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => { ca.textContent = "Copied"; setTimeout(() => ca.textContent = "Copy all with sources", 1400); }).catch(() => {});
  };
  const cl = $("clearAll"); if (cl) cl.onclick = () => { if (cl.dataset.sure){ setSaved([]); } else { cl.dataset.sure = 1; cl.textContent = "Click again to clear"; } };
}

const ROLE_ORDER = ["Prime Minister","Minister for Territories","Commonwealth minister for Aboriginal affairs","Government Resident","Administrator","Chief Protector of Aborigines","Head of Native Affairs","Director of Welfare","Chief Minister"];
function renderPower(){
  const y = state.year, hs = D.officeholders.filter(h => h.sy <= y);
  const groups = d3.group(hs, h => ROLE_ORDER.includes(h.role) ? h.role : "NT ministers by portfolio");
  const order = [...ROLE_ORDER, "NT ministers by portfolio"].filter(r => groups.has(r));
  $("pPower").innerHTML = `<h3>Who held the power</h3><p class="lede">Everyone recorded in these offices up to ${y}: ${hs.length} office terms. Those in office in ${y} are marked. Click a name to see the laws, policies and cuts recorded while they held office.</p>` +
    order.map(r => `<h4>${esc(r)}</h4><div class="tiles">${groups.get(r).slice().sort((p,q) => q.sy - p.sy).map(h => { const now = h.ey == null || h.ey >= y;
      return `<button class="tile ${now ? "now" : "past"}" data-key="H:${h.id}"><span class="av" aria-hidden="true">${esc(initials(h.person))}</span><b>${esc(h.person)}</b><small>${r === "NT ministers by portfolio" ? esc(h.role.replace(/^Minister for /, "")) + " · " : ""}${h.sy}–${h.ey ?? "now"}${h.party ? " · " + esc(h.party) : ""}</small></button>`; }).join("")}</div>`).join("") +
    `<p class="lede" style="margin-top:14px">Gaps still to fill: Chief Protectors 1911–1927, Directors of Native Affairs 1946–1953, and NT portfolio ministers 1978–2020.</p>`;
  $("pPower").querySelectorAll("[data-key]").forEach(b => b.onclick = ev => { const it = resolve(b.dataset.key); if (it && it.actor) zoomToActor(it.actor); choose(ev, b.dataset.key, true); });
}
})();
</script>
